name: rocky_companion
description: Rocky, a voice-first AI companion with persistent local memory.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  http: ^1.2.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.3
  intl: ^0.19.0

  # Optional platform-safe UUIDs for message IDs.
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
